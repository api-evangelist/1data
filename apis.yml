aid: 1data
name: ONEAIX (1data / Yida Technology)
description: >-
  ONEAIX (壹沓科技（上海）有限公司, formerly branded 1data / Yida Technology) is a Shanghai-headquartered
  enterprise AI company founded in 2016 that builds "digital employees" for global supply chains.
  Its 小沓AI platform ships two product lines — Cuber for supply-chain logistics (AI sales, route,
  operations, documentation and customs specialists covering quoting, booking, bills of lading,
  manifests and customs declaration) and Linker for supply-chain brands (brand, PR, GEO, content,
  e-commerce and data-analysis specialists) — on three in-house layers: Dax LLM, a supply-chain
  vertical LLM; Dax OS, an enterprise agent runtime and governance platform; and Dax KE, an
  agent-native knowledge engine, all delivered from the login-gated www.yxd.info tenant
  platform. Customers include COSCO Shipping, Sinotrans, Qingdao Port, DSV, Xtep and Colgate.
  ONEAIX publishes no developer program, API reference or machine-readable contract; the only
  agent-facing artifact it serves is a first-party llms.txt.
